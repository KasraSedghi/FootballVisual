[project]
name = "footballvisual"
version = "0.1.0"
description = "Broadcast football video to an interactive top-down tactical map"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
footballvisual = "footballvisual.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
